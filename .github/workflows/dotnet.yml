name: Build and Publish NuGet Package

on:
  push:
    branches:
      - release/*
    tags:
      - 'v*'

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    outputs:
      package_version: ${{ steps.pack.outputs.package_version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Required for SourceLink

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Get latest NuGet package version
        run: |
          nuget_response=$(curl -s "https://api.nuget.org/v3-flatcontainer/DotnetGeminiSDK/index.json")

          echo "NuGet API Response:"
          echo "$nuget_response"

          latest_version=$(echo "$nuget_response" | python -c "import sys, json; data = json.load(sys.stdin); versions = data.get('versions', []); versions = [v for v in versions if v is not None]; print(max(versions, key=lambda s: list(map(int, s.split('.')))) if versions else '')")

          echo "Latest version after parsing:"
          echo "$latest_version"

          if [ -z "$latest_version" ]; then
            echo "Error: Unable to determine the latest version from the NuGet API response."
            exit 1
          fi

          IFS='.' read -r -a version_parts <<< "$latest_version"
          echo "Version parts array: ${version_parts[@]}"
          
          if [ "${#version_parts[@]}" -lt 3 ]; then
            echo "Error: Insufficient version parts."
            exit 1
          fi
          
          set -x
          ((version_parts[2]++))
          set -x
          echo "Incremented version parts array: ${version_parts[@]}"
          new_version="${version_parts[0]}.${version_parts[1]}.${version_parts[2]}"

          echo "Latest version: $latest_version"
          echo "New version: $new_version"
          echo "NEW_VERSION=$new_version" >> $GITHUB_ENV

      - name: Show environment variable
        run: |
          echo "NEW_VERSION: $NEW_VERSION"

      - name: Install nuget CLI
        run: |
          sudo curl -o /usr/local/bin/nuget.exe https://dist.nuget.org/win-x86-commandline/latest/nuget.exe
          alias nuget="mono /usr/local/bin/nuget.exe"

      - name: Update Nuspec file
        run: |
          nuspec_path="nuget/dotnet-gemini.nuspec"
          sed -i "s/<version>.*<\/version>/<version>${NEW_VERSION}<\/version>/" "$nuspec_path"
          cat "$nuspec_path"

      - name: Restore dependencies
        run: dotnet restore src/DotnetGeminiSDK.sln

      - name: Build solution
        run: dotnet build src/DotnetGeminiSDK.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test src/DotnetGeminiSDK.Tests/DotnetGeminiSDK.Tests.csproj --configuration Release --no-build --verbosity normal

      - name: Pack NuGet package with symbols
        id: pack
        run: |
          # Create output directory
          mkdir -p nupkg
          
          # Pack main package with symbols and source
          dotnet pack src/DotnetGeminiSDK/DotnetGeminiSDK.csproj \
            --configuration Release \
            --output nupkg \
            --no-build \
            --include-symbols \
            --include-source \
            -p:PackageVersion=$NEW_VERSION \
            -p:SymbolPackageFormat=snupkg
          
          echo "package_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "Packaged NuGet package version: $NEW_VERSION"
          
          # List generated packages
          ls -la nupkg/

      - name: Push NuGet Package
        run: |
          # Push main package
          dotnet nuget push nupkg/DotnetGeminiSDK.$NEW_VERSION.nupkg \
            --source https://api.nuget.org/v3/index.json \
            --api-key ${{ secrets.NUGET_API_KEY }} \
            --skip-duplicate
          
          # Push symbols package
          dotnet nuget push nupkg/DotnetGeminiSDK.$NEW_VERSION.snupkg \
            --source https://api.nuget.org/v3/index.json \
            --api-key ${{ secrets.NUGET_API_KEY }} \
            --skip-duplicate
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
