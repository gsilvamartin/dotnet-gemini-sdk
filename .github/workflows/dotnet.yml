name: .NET

on:
  push:
    branches: [ "main" ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ "main" ]
  release:
    types: [ published ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Restore dependencies
      run: dotnet restore src/DotnetGeminiSDK.sln

    - name: Build
      run: dotnet build src/DotnetGeminiSDK.sln --configuration Release --no-restore

    - name: Test
      run: dotnet test src/DotnetGeminiSDK.sln --configuration Release --no-build --verbosity normal --collect:"XPlat Code Coverage"

    - name: Extract version from branch name
      id: get_version
      run: |
        echo "🔍 Extracting version from branch name..."
        
        # Extrair versão do nome da branch (ex: release/2.0.0 -> 2.0.0)
        if [[ "${{ github.ref }}" =~ refs/heads/release/(.+) ]]; then
          version="${BASH_REMATCH[1]}"
          echo "✅ Version extracted from branch: $version"
        elif [[ "${{ github.ref }}" =~ refs/tags/v(.+) ]]; then
          version="${BASH_REMATCH[1]}"
          echo "✅ Version extracted from tag: $version"
        else
          echo "❌ Error: Unable to extract version from ref: ${{ github.ref }}"
          echo "Expected format: refs/heads/release/X.Y.Z or refs/tags/vX.Y.Z"
          exit 1
        fi
        
        # Validar formato da versão (X.Y.Z)
        if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "❌ Error: Invalid version format: $version"
          echo "Expected format: X.Y.Z (e.g., 2.0.0)"
          exit 1
        fi
        
        echo "📊 Version parts: $version"
        
        # Exportar para GitHub Actions
        echo "NEW_VERSION=$version" >> $GITHUB_ENV
        echo "✅ Version $version set for GitHub Actions"
        
        echo "🎉 Final version: $version"

    - name: Pack
      run: dotnet pack src/DotnetGeminiSDK/DotnetGeminiSDK.csproj --configuration Release --no-build --output ./nupkgs --version-suffix ""

    - name: Push to NuGet
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: |
        echo "📦 Publishing to NuGet.org..."
        dotnet nuget push nupkgs/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
        echo "✅ Successfully published to NuGet.org"
